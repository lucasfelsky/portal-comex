# Le o JSON inline `cond_barra` do HTML da home da Praticagem ZP21 (sem OCR) e
# aplica em barra/current SOMENTE quando o status do site muda. Falhas vao para
# a DLQ e para o painel Admin -> Barra.
#
# O GitHub pode atrasar ou pular execucoes agendadas (observado 2-5 h com o cron
# horario). Por isso o painel Admin -> Barra alerta apos 8 h sem leitura bem-sucedida.
# Cron fora do minuto 0 (horario de maior fila do GitHub). Job leve: sem npm install,
# o script usa apenas builtins do Node 22.
name: Sync Bar Status

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-bar-status
  cancel-in-progress: false

jobs:
  sync-bar-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run bar status sync
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: node scripts/syncBarStatus.mjs
