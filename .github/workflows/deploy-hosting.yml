# Deploy do Portal COMEX (site principal) para Firebase Hosting - PRODUCAO (sq-comex-updates-3d22f).
#
# Gatilhos:
#   - workflow_run do workflow "CI" (ci.yml) concluido com SUCESSO para um PUSH em main
#     (PR nao publica; fork nao publica). Publica exatamente o commit testado (head_sha).
#   - workflow_dispatch manual, aceito somente em refs/heads/main.
#   Nao ha mais deploy por push direto nem por tag v*.
#   Obs.: workflow_run so dispara com a versao deste arquivo que esta na branch default.
#
# Credencial (auto-detectada, nesta ordem):
#   1. WIF: GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT (mesmo pool/provider/SA do
#      IntelliQuote; SA precisa de roles/firebasehosting.admin). google-github-actions/auth
#      exporta ADC, que o firebase-tools honra.
#   2. FIREBASE_TOKEN (legado/deprecated) - emite ::warning::.
#   3. Nenhuma -> pula o deploy com ::warning::.
# Build-time: VITE_FIREBASE_* (6, obrigatorios) + VITE_FCM_VAPID_KEY (opcional).
# firebase-tools = versao do devDependency (package-lock), nao @latest.
# Functions, firestore/storage rules e backfills continuam MANUAIS (ver RUNBOOK).

name: Deploy to Firebase Hosting

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    name: Build + Deploy to Firebase Hosting
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run: github.sha = HEAD da default branch, NAO o commit testado.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Commit publicado
        run: echo "Evento=${{ github.event_name }} SHA=$(git rev-parse HEAD)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install
        run: npm ci

      - name: Validar config do Firebase para o build
        run: |
          missing=0
          for v in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID; do
            val=$(printenv "$v" || true)
            if [ -z "$val" ]; then
              echo "::error::Secret/variavel ausente: $v"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Config do Firebase incompleta — o build seria publicado com Firebase Auth desativado ('Firebase Auth nao configurado'). Adicione os secrets VITE_FIREBASE_* no GitHub (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "Config do Firebase OK para o build."
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # F6: chave VAPID do web push (FCM). Opcional — sem ela o build
          # passa e o push fica dormente (isFcmSupported() === false).
          VITE_FCM_VAPID_KEY: ${{ secrets.VITE_FCM_VAPID_KEY }}
        run: npm run build

      - name: Detectar credencial disponivel
        id: creds
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -n "$WIF_SA" ]; then
            echo "auth_method=WIF" >> "$GITHUB_OUTPUT"
            echo "Auth method: WIF"
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "auth_method=FIREBASE_TOKEN" >> "$GITHUB_OUTPUT"
            echo "::warning::Usando FIREBASE_TOKEN (deprecated). Configure GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT."
          else
            echo "auth_method=NONE" >> "$GITHUB_OUTPUT"
            echo "::warning::Nenhuma credencial (WIF ou FIREBASE_TOKEN). Deploy sera pulado."
          fi

      - name: Autenticar no Google Cloud (WIF)
        if: ${{ steps.creds.outputs.auth_method == 'WIF' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        if: ${{ steps.creds.outputs.auth_method != 'NONE' }}
        env:
          # So injeta o token no modo legado: com WIF, um FIREBASE_TOKEN presente teria
          # precedencia sobre o ADC e mascararia a validacao do WIF.
          FIREBASE_TOKEN: ${{ steps.creds.outputs.auth_method == 'FIREBASE_TOKEN' && secrets.FIREBASE_TOKEN || '' }}
        run: |
          set +e
          npx --no-install firebase --version
          npx --no-install firebase deploy --only hosting \
            --config firebase.portal-comex.json \
            --project sq-comex-updates-3d22f > deploy.log 2>&1
          code=$?
          cat deploy.log
          if [ "$code" -ne 0 ]; then
            # HTTP 400 "is the current active version" = versao buildada identica
            # a ativa em producao (nada a publicar). Tratar como sucesso.
            if grep -q "is the current active version" deploy.log; then
              echo "::notice::Versao de hosting identica a ativa em producao — nada a publicar."
              exit 0
            fi
            exit "$code"
          fi

      - name: Aviso se nenhuma credencial disponivel
        if: ${{ steps.creds.outputs.auth_method == 'NONE' }}
        run: |
          echo "::warning::Nenhum auth method configurado. Adicione GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT (WIF) em Settings > Secrets and variables > Actions."
