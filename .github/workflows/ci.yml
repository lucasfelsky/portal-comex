name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs em PRs subsequentes (mesmo branch) se um novo commit
# chegou - economiza minutos do CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests + build
    runs-on: ubuntu-latest
    env:
      # VITE_* sao embutidos no build pelo Vite. Placeholders funcionam
      # em dev; secrets reais ficam no GitHub para producao.
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyDevPlaceholder' }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'dev-placeholder.firebaseapp.com' }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'dev-placeholder' }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'dev-placeholder.appspot.com' }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '000000000000' }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:000000000000:web:devplaceholder' }}
      VITE_INTELLIQUOTE_WEB_URL: ${{ secrets.VITE_INTELLIQUOTE_WEB_URL || 'https://intelliquote.portal-comex.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Suite de testes
        # Vitest retorna exit 0 mesmo com 1 skip, entao este step
        # sempre passa. O audit (`tests/scripts/audit-vault-counts`)
        # detecta drift de counts quando o fixture precisa atualizar.
        run: npm test
      - name: Build de producao
        run: npm run build

  rules-structure:
    name: Firestore rules (structure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validacao estrutural
        # Valida que firestore.rules tem os blocos esperados
        # (rules_version, service, funcoes, colecoes, guardas).
        # Quando o ambiente ganhar Java 21+, este job pode ser
        # substituido por @firebase/rules-unit-testing rodando
        # contra o emulator.
        run: npx vitest run tests/firebase/rules.structure.test.js


