name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-and-build:
    name: Unit tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_INTELLIQUOTE_WEB_URL: ${{ secrets.VITE_INTELLIQUOTE_WEB_URL }}
        run: npm run build

  rules-unit-testing:
    name: Firestore rules (rules-unit-testing)
    runs-on: ubuntu-latest
    # O runner ubuntu-latest do GitHub Actions vem com Java 17.
    # Para usar @firebase/rules-unit-testing (requer Java 21+), instalamos
    # explicitamente via setup-java.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Firestore rules unit tests
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          GCLOUD_PROJECT: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
        run: |
          # TODO: assim que @firebase/rules-unit-testing estiver integrado
          # como dependencia opcional e os testes em tests/firebase/rules-emulator.test.js
          # existirem, basta rodar:
          #   npx vitest run tests/firebase/rules-emulator.test.js
          #
          # Por enquanto so valida que a secao de regras compila
          npx vitest run tests/firebase/rules.structure.test.js
